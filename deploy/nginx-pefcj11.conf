# Nginx: сайт + прокси API чата на одном домене
# Файл: /etc/nginx/sites-available/pefcj11
# Замените ВАШ_ДОМЕН на реальный домен или IP

server {
    listen 80;
    server_name ВАШ_ДОМЕН;

    client_max_body_size 10M;

    # Flask-сайт (gunicorn :5000)
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI чат-бот (uvicorn :8000)
    # Запрос /api/chat -> backend /chat
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
